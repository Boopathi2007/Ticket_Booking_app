<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in – EventEase</title>
  <meta name="description" content="Sign in to your EventEase account to discover and book tickets." />

  <!-- Google Fonts & Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <script>
    // Ensure no stale user data persists when loading login page
    localStorage.removeItem('eventease_current_user');
    localStorage.removeItem('eventease_token');
  </script>

  <!-- Split Screen Auth Layout -->
  <div class="auth-split-layout">
    
    <!-- Left Column: Purple Brand Area -->
    <div class="auth-brand-left">
      <div class="brand-ticket-badge">
        <i class="fas fa-ticket-alt"></i>
      </div>
      <h2>Discover and Book</h2>
      <p style="color: var(--accent-yellow); font-weight: 700; font-size: 1.3rem; margin-bottom: 0.5rem;">Amazing Events</p>
      <p>Sign in to access your digital tickets, manage bookings, and explore exciting events near you.</p>
    </div>

    <!-- Right Column: Sign In Form Area -->
    <div class="auth-form-right">
      <a href="index.html" class="auth-back-link">
        <i class="fas fa-arrow-left"></i> Back to home
      </a>

      <h1 class="auth-form-title">Sign in</h1>
      <p class="auth-form-subtitle">
        Don't have an account? <a href="register.html">Sign up free</a>
      </p>

      <!-- autocomplete="off" prevents browser from auto-filling old saved credentials -->
      <form id="login-form" onsubmit="handleLoginSubmit(event)" autocomplete="off">
        <!-- Email address -->
        <div class="form-field-group">
          <label class="form-field-label" for="login-email">Email address</label>
          <input
            type="email"
            id="login-email"
            name="login-email"
            class="form-field-input"
            placeholder="you@example.com"
            required
            autocomplete="off"
          />
        </div>

        <!-- Password -->
        <div class="form-field-group">
          <label class="form-field-label" for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="login-password"
            class="form-field-input"
            placeholder="Enter your password"
            required
            autocomplete="new-password"
          />
        </div>

        <!-- Forgot password -->
        <div class="form-extra-row">
          <a href="javascript:void(0)" onclick="showToast('Password reset link sent to your email', 'info')" class="forgot-password-link">
            Forgot password?
          </a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="login-submit-btn" class="btn-auth-submit">
          Sign in
        </button>

        <!-- Divider -->
        <div class="auth-or-divider">
          or continue with
        </div>

        <!-- Social Buttons -->
        <div class="social-btns-row">
          <button type="button" class="btn-social-outline" onclick="socialLogin('Google')">
            <i class="fab fa-google" style="color: #EA4335;"></i> Google
          </button>
          <button type="button" class="btn-social-outline" onclick="socialLogin('Apple')">
            <i class="fab fa-apple" style="color: #000000;"></i> Apple
          </button>
        </div>
      </form>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/utils.js?v=4"></script>
  <script src="js/api.js?v=4"></script>
  <script src="js/auth.js?v=4"></script>
  <script>
    // Clear any stale pre-filled values as soon as page loads
    window.addEventListener('DOMContentLoaded', () => {
      // If a session exists, log out to avoid showing previous user's name
      if (typeof Auth !== 'undefined' && Auth.isLoggedIn && Auth.isLoggedIn()) {
        Auth.logout();
      }
      document.getElementById('login-email').value = '';
      document.getElementById('login-password').value = '';
    });

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showToast('Please enter email and password.', 'error');
        return;
      }

      // 1. Try Backend API login if Spring Boot server is running
      if (typeof api !== 'undefined' && api.auth && api.auth.login) {
        try {
          const res = await api.auth.login({ email, password });
          if (res && res.token) {
            localStorage.setItem('eventease_token', res.token);
            Auth.setUser({
              id: res.userId,
              name: res.name,
              email: res.email,
              role: res.role
            });
            showToast(`Welcome back, ${res.name}! 🎉`, 'success');
            setTimeout(() => {
              const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
              window.location.href = redirect;
            }, 600);
            return;
          }
        } catch (err) {
          // Backend not running – fall through to local auth
          console.info('Backend not reachable, using local auth.');
        }
      }

      // 2. Local auth: only allow login if account was registered via register.html
      const registeredUsers = JSON.parse(localStorage.getItem('eventease_registered_users') || '[]');
      const found = registeredUsers.find(u => u.email && u.email.toLowerCase() === email);

      if (!found) {
        showToast('No account found with this email. Please register first.', 'error');
        return;
      }

      // Check password (plain-text local comparison – only for offline demo mode)
      if (found.password && found.password !== password) {
        showToast('Incorrect password. Please try again.', 'error');
        return;
      }

      // Login success – use the exact name from registration
      Auth.setUser({
        id: found.id || Date.now(),
        name: found.name,
        email: found.email,
        phone: found.phone || '',
        role: found.role || 'USER'
      });

      showToast(`Welcome back, ${found.name}! 🎉`, 'success');
      setTimeout(() => {
        const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
        window.location.href = redirect;
      }, 600);
    }

    function socialLogin(provider) {
      showToast(`${provider} sign-in is not available in offline mode.`, 'info');
    }
  </script>
</body>
</html>
