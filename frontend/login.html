<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in – EventEase</title>
  <meta name="description" content="Sign in to your EventEase account to discover and book tickets." />

  <!-- Google Fonts & Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="toast-container"></div>

  <!-- Split Screen Auth Layout (Image 3) -->
  <div class="auth-split-layout">
    
    <!-- Left Column: Purple Brand Area -->
    <div class="auth-brand-left">
      <div class="brand-ticket-badge">
        <i class="fas fa-ticket-alt"></i>
      </div>
      <h2>Discover and Book</h2>
      <p style="color: var(--accent-yellow); font-weight: 700; font-size: 1.3rem; margin-bottom: 0.5rem;">Amazing Events</p>
      <p>Sign in to access your digital tickets, manage bookings, and explore exciting events near you.</p>
    </div>

    <!-- Right Column: Sign In Form Area -->
    <div class="auth-form-right">
      <a href="index.html" class="auth-back-link">
        <i class="fas fa-arrow-left"></i> Back to home
      </a>

      <h1 class="auth-form-title">Sign in</h1>
      <p class="auth-form-subtitle">
        Don't have an account? <a href="register.html">Sign up free</a>
      </p>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <!-- Email address -->
        <div class="form-field-group">
          <label class="form-field-label" for="email">Email address</label>
          <input type="email" id="email" class="form-field-input" placeholder="you@example.com" required value="priya@example.com" />
        </div>

        <!-- Password -->
        <div class="form-field-group">
          <label class="form-field-label" for="password">Password</label>
          <input type="password" id="password" class="form-field-input" placeholder="Enter your password" required value="Password@123" />
        </div>

        <!-- Forgot password -->
        <div class="form-extra-row">
          <a href="javascript:void(0)" onclick="showToast('Password reset link sent to your email', 'info')" class="forgot-password-link">
            Forgot password?
          </a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-submit">
          Sign in
        </button>

        <!-- Demo Credentials Box (Image 3) -->
        <div class="demo-account-pill-box" onclick="fillAdminDemo()" title="Click to autofill admin demo">
          Demo: use <strong>admin@eventease.in</strong> for admin access
        </div>

        <!-- Divider -->
        <div class="auth-or-divider">
          or continue with
        </div>

        <!-- Social Buttons -->
        <div class="social-btns-row">
          <button type="button" class="btn-social-outline" onclick="socialLogin('Google')">
            <i class="fab fa-google" style="color: #EA4335;"></i> Google
          </button>
          <button type="button" class="btn-social-outline" onclick="socialLogin('Apple')">
            <i class="fab fa-apple" style="color: #000000;"></i> Apple
          </button>
        </div>
      </form>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      
      let name = 'Priya Sharma';
      if (email.includes('admin')) name = 'EventEase Admin';
      
      Auth.loginAs(email, name);
    }

    function fillAdminDemo() {
      document.getElementById('email').value = 'admin@eventease.in';
      document.getElementById('password').value = 'Admin@123';
      showToast('Admin credentials filled! Click "Sign in" to proceed.', 'info');
    }

    function socialLogin(provider) {
      showToast(`Signing in with ${provider}...`, 'info');
      setTimeout(() => {
        Auth.loginAs('priya@example.com', 'Priya Sharma');
      }, 700);
    }
  </script>
</body>
</html>
