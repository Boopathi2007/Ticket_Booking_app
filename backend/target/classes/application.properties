# =====================================================
# EventEase – Spring Boot Application Properties
# =====================================================

# Server
server.port=8080
server.servlet.context-path=/api

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/eventease_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
jwt.secret=EventEaseSecretKey2026SDG9InnovationInfrastructure!@#$%
jwt.expiration=86400000

# ---- File Upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---- CORS ----
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500

# ---- Logging ----
logging.level.com.eventease=DEBUG
logging.level.org.springframework.security=WARN
